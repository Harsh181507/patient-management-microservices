# Serves the UI and forwards API calls to the API Gateway inside the Docker network,
# so the browser only talks to one origin (http://localhost:3000).
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location ~ ^/(auth|api)/ {
        proxy_pass http://api-gateway:4004;
        proxy_set_header Host $host;
    }
}
